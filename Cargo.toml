[workspace]
members = ["frontend", "backend", "common"]
resolver = "2"

# Smaller wasm bundle for the island chunks.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[[workspace.metadata.leptos]]
name = "tutoring-website"
bin-package = "backend"
lib-package = "tutoring-website-frontend"

site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "frontend/style/main.css"
assets-dir = "frontend/assets"
site-addr = "127.0.0.1:3070"
reload-port = 3001

bin-features = []
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"

# Rebuild styles when theme tokens change during `cargo leptos watch`.
watch-additional-files = ["frontend/theme"]
