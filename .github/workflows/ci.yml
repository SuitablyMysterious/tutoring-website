name: CI
on:
  push:
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  check_rust:
    name: Check & Lint Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy -p tutoring-website-frontend --features ssr -- -D warnings
      - run: cargo clippy -p tutoring-website-frontend --features hydrate --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p backend -- -D warnings
      - run: cargo clippy -p common -- -D warnings

  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test -p tutoring-website-frontend --features ssr

  build:
    name: cargo-leptos Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked
      - run: cargo leptos build --release
      - name: Built stylesheet contains token-derived utilities
        # Tailwind silently skips unknown utilities, so a renamed @theme
        # token would otherwise ship as missing styles without failing CI.
        run: |
          css=target/site/pkg/tutoring-website.css
          test -s "$css" || { echo "built stylesheet missing or empty"; exit 1; }
          for cls in bg-primary text-primary-contrast bg-surface-alt gap-md py-xl rounded-md font-heading hp-field; do
            grep -q -- "$cls" "$css" || { echo "missing utility '$cls' in built CSS"; exit 1; }
          done
