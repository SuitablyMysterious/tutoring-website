name: CI
on:
  push:
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  check_rust:
      name: Check & Lint Rust
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5
        - uses: Swatinem/rust-cache@v2
        - run: rustup target add wasm32-unknown-unknown
        - run: cargo fmt --check
        - run: cargo clippy --manifest-path frontend/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
        - run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

  lint_html:
    name: HTML/CSS Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
      - run: npm install -g prettier cspell vnu-jar
      - run: prettier --check "**/*.html"
      - run: cspell "**/*.html"
      - run: vnu --errors-only **/*.html

  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --manifest-path backend/Cargo.toml --verbose

  build:
    name: Trunk Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - name: Install trunk
        run: cargo install trunk
      - run: trunk build --release
        working-directory: frontend
